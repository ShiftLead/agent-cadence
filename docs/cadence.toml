# docs/cadence.toml — agent-cadence's own cadence settings (cadence.md §9.18). Not the seed:
# files/docs/cadence.toml is what `agent-cadence adopt` creates in a consumer; this file is this repo's.
# People write it; tools only read it.

# The merge gate (cadence.md §4.12): `files/scripts/precheck.py --pr <n>` runs this in a clean
# worktree at the PR's head and records cadence/precheck on it. CI=true makes a SKIP fail. The
# publish gate runs last (TD-189): this repo is public, so a PR that adds a private name — a machine
# path, a repo on the roster, a name the machine's publish-names lists — fails here, before it is
# published by merging. Findings meant to be public are accepted in docs/publish-accept.txt.
precheck = "ruff check files/scripts/ && CI=true ./run_tests.sh && git ls-files -z | python3 files/scripts/cadence_layer.py --publish-check --accept docs/publish-accept.txt --files-from -"

# The publish gate needs the machine's publish-names to run here; a machine without them exits 2
# rather than pass every name the list would flag (TD-189).
publish-gate = "required"

# A public repo's ledger-id takes never name the machine (TD-124, cadence.md §2.10).
ledger-ids-host = "off"

# What is far-reaching here (cadence.md §4.8, TD-281, set by the person on 2026-11-17, TD-289): every
# payload change reaches every consumer, so a design whose builds change the rules every session
# reads, the procedures, the seeds, or the scripts that decide whose Go counts is the person's to go.
# The globs match as [precheck-paths]' do (fnmatch on the repo-relative path, `*` crossing `/`).
[far-reaching]
paths = [
    "files/docs/cadence.md",
    "files/docs/procedures/**",
    "files/docs/user_attention.md", "files/docs/user_attention/README.md",
    "files/docs/technical_debt.md", "files/docs/technical_debt_archive.md",
    "files/docs/claude-memory/MEMORY.md", "files/.claude/settings.json", "files/docs/cadence.toml",
    "files/AGENTS.md", "files/.gemini/settings.json", "files/.gitattributes",
    "files/scripts/check_cadence.py", "files/scripts/review_stats.py", "files/scripts/cadence_config.py",
]
